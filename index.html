<title>O'sish yo'li 2.0: kirish</title>
<style>
:root { --green: #008D4A; --black: #000A05; --fg: #E6EFEA; --muted: #93A89C; --line: #1E3328; --bad: #F08A80; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(60% 50% at 80% 10%, rgba(31,212,122,.25), rgba(31,212,122,0) 60%), linear-gradient(160deg, #0B2316 0%, #04110A 55%, #000A05 100%); color: var(--fg); font-family: "Onest", "Segoe UI", Roboto, Arial, sans-serif; display: grid; place-items: center; padding: 16px; }
.card { width: 100%; max-width: 380px; background: rgba(13,26,19,.85); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); display: grid; gap: 14px; }
.logo { height: 28px; width: auto; justify-self: start; }
h1 { margin: 4px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF; }
h1 span { color: #2FBF78; }
p.sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
input { font: inherit; font-size: 16px; color: #FFFFFF; background: #0A1A11; border: 1px solid #2A4234; border-radius: 10px; padding: 12px 14px; outline: none; }
input:focus { border-color: #2FBF78; box-shadow: 0 0 0 3px rgba(47,191,120,.25); }
button { font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 999px; padding: 13px 18px; background: linear-gradient(180deg, #4EEB98, #1FB765); color: #03140A; cursor: pointer; }
button[disabled] { opacity: .6; cursor: wait; }
.err { min-height: 18px; margin: 0; color: var(--bad); font-size: 13px; }
.foot { margin: 0; font-size: 12px; color: var(--muted); }
.load { display: none; text-align: center; color: var(--muted); font-size: 14px; }
body.busy .card form { display: none; }
body.busy .load { display: block; }
</style>

  <h1>O'sish yo'li <span>2.0</span></h1>
  <p class="sub">Ichki sahifa. O'zingizning login va parolingiz bilan kiring.</p>

<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzzWzzf_qwKR0Zm3F4NraajnamNunhzHxF-yxxp_Rc2oBpMmKwBeRIpkVT86wCJIC0c/exec', BUILD = 'mvxv8884', SK = 'oy_s';
  var $ = function (id) { return document.getElementById(id); };
  function load() { try { return JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { return null; } }
  function save(s) { try { localStorage.setItem(SK, JSON.stringify(s)); } catch (e) {} }
  function clear() { try { localStorage.removeItem(SK); } catch (e) {} }
  function busy(on) { document.body.classList.toggle('busy', !!on); }
  function err(t) { busy(false); $('err').textContent = t || ''; $('go').disabled = false; }
  function api(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function enc(t) { return new TextEncoder().encode(t); }
  function hkey(raw) { return crypto.subtle.importKey('raw', raw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']); }
  function sign(k, data) { return crypto.subtle.sign('HMAC', k, data).then(function (x) { return new Uint8Array(x); }); }
  function decrypt(j, keyB64) {
    var key, encK, macK, nonce = b64(j.n), ct = b64(j.c), tag = b64(j.t);
    return hkey(b64(keyB64)).then(function (k) { key = k; return Promise.all([sign(key, enc('enc')), sign(key, enc('mac'))]); })
      .then(function (r) { return Promise.all([hkey(r[0]), hkey(r[1])]); })
      .then(function (r) {
        encK = r[0]; macK = r[1];
        var md = new Uint8Array(nonce.length + ct.length); md.set(nonce, 0); md.set(ct, nonce.length);
        return sign(macK, md);
      })
      .then(function (t2) {
        if (t2.length !== tag.length) throw new Error('tag');
        var d = 0; for (var i = 0; i < tag.length; i++) d |= t2[i] ^ tag[i]; if (d) throw new Error('tag');
        var n = Math.ceil(ct.length / 32), jobs = [];
        for (var b = 0; b < n; b++) { var blk = new Uint8Array(20); blk.set(nonce, 0); new DataView(blk.buffer).setUint32(16, b); jobs.push(sign(encK, blk)); }

      })

        var out = new Uint8Array(ct.length);
        for (var i = 0; i < ct.length; i++) out[i] = ct[i] ^ ks[i >> 5][i & 31];
